name: Build debug APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check model download URLs
        run: |
          for u in \
            https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx; do
            size=$(curl -sfL -o /dev/null -r 0-0 -w '%{http_code}' "$u") || { echo "NG: $u"; exit 1; }
            echo "OK ($size): $u"
          done

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LiveTranslate.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiveTranslate-apk
          path: LiveTranslate.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ライブ翻訳 (ビルド ${{ github.run_number }})
          body: |
            下の「LiveTranslate.apk」をタップするとダウンロードできます。
            ブランチ: ${{ github.ref_name }} / コミット: ${{ github.sha }}
          files: LiveTranslate.apk
          make_latest: true
