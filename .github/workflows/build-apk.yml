name: Build debug APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 高精度版（HQ）か軽量版かで、APK名とリリース名を切り替える
      - name: Decide release name
        run: |
          if grep -q 'com.example.livetranslate.hq' app/build.gradle; then
            {
              echo "APK_NAME=LiveTranslateHQ.apk"
              echo "RELEASE_TAG=hq-build-${{ github.run_number }}"
              echo "RELEASE_NAME=ライブ翻訳HQ (ビルド ${{ github.run_number }})"
              echo "MAKE_LATEST=true"
            } >> "$GITHUB_ENV"
          else
            {
              echo "APK_NAME=LiveTranslate.apk"
              echo "RELEASE_TAG=v1-lite"
              echo "RELEASE_NAME=ライブ翻訳 軽量版 (v1-lite)"
              echo "MAKE_LATEST=false"
            } >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check model download URLs
        if: env.MAKE_LATEST == 'true'
        run: |
          for u in \
            https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx; do
            size=$(curl -sfL -o /dev/null -r 0-0 -w '%{http_code}' "$u") || { echo "NG: $u"; exit 1; }
            echo "OK ($size): $u"
          done

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            下の「${{ env.APK_NAME }}」をタップするとダウンロードできます。
            ブランチ: ${{ github.ref_name }} / コミット: ${{ github.sha }}
          files: ${{ env.APK_NAME }}
          make_latest: ${{ env.MAKE_LATEST }}
