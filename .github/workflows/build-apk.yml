name: Build debug APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 軽量版（Vosk版）のコードを「v1-lite」タグで残す（まだ無いときだけ作る）
      # タグはリリースとして作り、軽量版APK（build-2）も一緒に添付しておく
      - name: Keep lite version tag (v1-lite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1-lite -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1-lite already exists"
          else
            gh release download build-2 -R "$GITHUB_REPOSITORY" -p LiveTranslate.apk -D lite
            gh release create v1-lite lite/LiveTranslate.apk -R "$GITHUB_REPOSITORY" \
              --target 8fd6e6a78a9a45fa3055cdc208a43e2f4b018a11 \
              --title "ライブ翻訳 軽量版 (v1-lite)" \
              --notes "Vosk音声認識の軽量版。ライブ翻訳HQとは別アプリなので同時にインストールできます。" \
              --latest=false
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check model download URLs
        run: |
          for u in \
            https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx; do
            size=$(curl -sfL -o /dev/null -r 0-0 -w '%{http_code}' "$u") || { echo "NG: $u"; exit 1; }
            echo "OK ($size): $u"
          done

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LiveTranslateHQ.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiveTranslateHQ.apk
          path: LiveTranslateHQ.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hq-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ライブ翻訳HQ (ビルド ${{ github.run_number }})
          body: |
            下の「LiveTranslateHQ.apk」をタップするとダウンロードできます。
            ブランチ: ${{ github.ref_name }} / コミット: ${{ github.sha }}
          files: LiveTranslateHQ.apk
          make_latest: true
