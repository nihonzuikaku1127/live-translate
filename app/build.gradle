plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 音声認識ライブラリ sherpa-onnx（公式リリースのAARを初回ビルド時にダウンロードする）
def sherpaOnnxVersion = '1.13.8'
def sherpaOnnxAar = file("libs/sherpa-onnx-${sherpaOnnxVersion}.aar")
if (!sherpaOnnxAar.exists()) {
    sherpaOnnxAar.parentFile.mkdirs()
    def url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${sherpaOnnxVersion}/sherpa-onnx-${sherpaOnnxVersion}.aar"
    logger.lifecycle("Downloading ${url}")
    def tmp = file("${sherpaOnnxAar.path}.part")
    new URL(url).withInputStream { input -> tmp.withOutputStream { it << input } }
    tmp.renameTo(sherpaOnnxAar)
}

android {
    namespace 'com.example.livetranslate'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.livetranslate.hq"  // 軽量版(com.example.livetranslate)と共存させるため別ID
        minSdk 29          // Android 10以上（他アプリの音声取得に必要）
        targetSdk 34
        versionCode 2
        versionName "2.0"
        // 使用端末（Snapdragon 8 Elite / Dimensity 9600 Pro）は64bit専用なので arm64 のみ入れる
        ndk { abiFilters 'arm64-v8a' }
    }

    // 毎回同じ鍵で署名して、新しいAPKを上書きインストールできるようにする
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // オフライン音声認識（SenseVoice）と発話区切り（Silero VAD）
    implementation files(sherpaOnnxAar)
    // オフライン翻訳（Google ML Kit）
    implementation 'com.google.mlkit:translate:17.0.3'
}
